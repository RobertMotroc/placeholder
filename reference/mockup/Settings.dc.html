<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 600px; height: 1000px; overflow: hidden; background: #F4F1F8; font-family: 'Nunito', sans-serif; color-scheme: light">
  <div style="position: absolute; left: 40px; top: 40px; width: 520px; box-sizing: border-box; overflow: hidden; background: {{bezel}}; border: 3px solid {{edge}}; border-radius: 22px; box-shadow: 0 6px 0 {{edge}}; color: {{text}}; font-size: 15px; font-weight: 700; line-height: 1.3; display: flex; flex-direction: column">

    <div style="height: 56px; box-sizing: border-box; padding: 0 6px 0 16px; background: {{shell}}; border-bottom: 3px solid {{edge}}; display: flex; align-items: center; gap: 10px">
      <img src="/_blob/92fe2001fb6c61bee48b01c0be790603" alt="" style="width: 24px; height: 24px; image-rendering: pixelated">
      <h1 style="margin: 0; flex: 1; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 22px; line-height: 1">Settings</h1>
      <button type="button" aria-label="Close settings" style="width: 44px; height: 44px; padding: 0; background: transparent; border: 0; color: {{text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"></path></svg>
      </button>
    </div>

    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 20px">

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.08em; color: {{sub}}">PET</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <label style="box-sizing: border-box; padding: 10px 6px; background: {{soft}}; border: 3px solid {{mark}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span style="width: 64px; height: 64px; box-sizing: border-box; background: {{sky}}; border: 2px solid {{edge}}; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
              <img src="/_blob/92fe2001fb6c61bee48b01c0be790603" alt="" style="width: 48px; height: 48px; image-rendering: pixelated">
            </span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="pet" checked="{{ true }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Hare</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: transparent; border: 3px solid {{soft}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span style="width: 64px; height: 64px; box-sizing: border-box; background: {{sky}}; border: 2px dashed {{edge}}; border-radius: 12px; color: {{edge}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="36" height="36" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="4" width="2" height="2"></rect><rect x="3" y="1" width="2" height="3"></rect><rect x="7" y="1" width="2" height="3"></rect><rect x="9" y="4" width="2" height="2"></rect><rect x="4" y="5" width="4" height="1"></rect><rect x="3" y="6" width="6" height="4"></rect><rect x="4" y="10" width="4" height="1"></rect></svg>
            </span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="pet" checked="{{ false }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Fox</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: transparent; border: 3px solid {{soft}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span style="width: 64px; height: 64px; box-sizing: border-box; background: {{sky}}; border: 2px dashed {{edge}}; border-radius: 12px; color: {{edge}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="36" height="36" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="4" width="2" height="2"></rect><rect x="3" y="1" width="2" height="3"></rect><rect x="7" y="1" width="2" height="3"></rect><rect x="9" y="4" width="2" height="2"></rect><rect x="4" y="5" width="4" height="1"></rect><rect x="3" y="6" width="6" height="4"></rect><rect x="4" y="10" width="4" height="1"></rect></svg>
            </span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="pet" checked="{{ false }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Cat</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: transparent; border: 3px solid {{soft}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span style="width: 64px; height: 64px; box-sizing: border-box; background: {{sky}}; border: 2px dashed {{edge}}; border-radius: 12px; color: {{edge}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="36" height="36" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="4" width="2" height="2"></rect><rect x="3" y="1" width="2" height="3"></rect><rect x="7" y="1" width="2" height="3"></rect><rect x="9" y="4" width="2" height="2"></rect><rect x="4" y="5" width="4" height="1"></rect><rect x="3" y="6" width="6" height="4"></rect><rect x="4" y="10" width="4" height="1"></rect></svg>
            </span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="pet" checked="{{ false }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Frog</span>
          </label>
        </div>
        <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">Animate the pet<input type="checkbox" checked="{{ true }}" style="width: 18px; height: 18px; margin: 0; accent-color: {{mark}}"></label>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.08em; color: {{sub}}">THEME</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <label style="box-sizing: border-box; padding: 10px 6px; background: {{sel.Lilac.bg}}; border: 3px solid {{sel.Lilac.bd}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span aria-hidden="true" style="width: 36px; height: 42px; box-sizing: border-box; background: #CDB8F6; border: 3px solid #9A80D8; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F9A1CF"></span></span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="theme" checked="{{sel.Lilac.on}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Lilac</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: {{sel.Mint.bg}}; border: 3px solid {{sel.Mint.bd}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span aria-hidden="true" style="width: 36px; height: 42px; box-sizing: border-box; background: #B8EBD4; border: 3px solid #6FBF9F; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFE08A"></span></span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="theme" checked="{{sel.Mint.on}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Mint</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: {{sel.Peach.bg}}; border: 3px solid {{sel.Peach.bd}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span aria-hidden="true" style="width: 36px; height: 42px; box-sizing: border-box; background: #FFD0B8; border: 3px solid #E89A78; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #A9DDF2"></span></span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="theme" checked="{{sel.Peach.on}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Peach</span>
          </label>
          <label style="box-sizing: border-box; padding: 10px 6px; background: {{sel.Starlight.bg}}; border: 3px solid {{sel.Starlight.bd}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer">
            <span aria-hidden="true" style="width: 36px; height: 42px; box-sizing: border-box; background: #B9CFF7; border: 3px solid #7C98DA; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFC2DD"></span></span>
            <span style="display: flex; align-items: center; gap: 6px"><input type="radio" name="theme" checked="{{sel.Starlight.on}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Starlight</span>
          </label>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.08em; color: {{sub}}">TIMER</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px">
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px">Focus (min)<input type="number" min="1" value="25" style="width: 60px; height: 34px; box-sizing: border-box; padding: 0 4px; background: #FFFFFF; border: 2px solid {{sub}}; border-radius: 10px; color: {{text}}; font-family: 'Pixelify Sans', monospace; font-size: 18px; text-align: center"></label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px">Short break (min)<input type="number" min="1" value="5" style="width: 60px; height: 34px; box-sizing: border-box; padding: 0 4px; background: #FFFFFF; border: 2px solid {{sub}}; border-radius: 10px; color: {{text}}; font-family: 'Pixelify Sans', monospace; font-size: 18px; text-align: center"></label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px">Long break (min)<input type="number" min="1" value="15" style="width: 60px; height: 34px; box-sizing: border-box; padding: 0 4px; background: #FFFFFF; border: 2px solid {{sub}}; border-radius: 10px; color: {{text}}; font-family: 'Pixelify Sans', monospace; font-size: 18px; text-align: center"></label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px">Sessions per cycle<input type="number" min="1" value="4" style="width: 60px; height: 34px; box-sizing: border-box; padding: 0 4px; background: #FFFFFF; border: 2px solid {{sub}}; border-radius: 10px; color: {{text}}; font-family: 'Pixelify Sans', monospace; font-size: 18px; text-align: center"></label>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.08em; color: {{sub}}">OVERLAY</h2>
        <div style="display: flex; flex-direction: column">
          <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px">Size
            <span style="display: flex; align-items: center; gap: 18px">
              <label style="min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer"><input type="radio" name="size" checked="{{ false }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Small</label>
              <label style="min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer"><input type="radio" name="size" checked="{{ true }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Medium</label>
              <label style="min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer"><input type="radio" name="size" checked="{{ false }}" style="width: 16px; height: 16px; margin: 0; accent-color: {{mark}}">Large</label>
            </span>
          </div>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px">Opacity
            <span style="display: flex; align-items: center; gap: 10px"><input type="range" min="40" max="100" value="90" style="width: 170px; margin: 0; accent-color: {{mark}}"><span style="width: 40px; text-align: right">90%</span></span>
          </label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">Always on top<input type="checkbox" checked="{{ true }}" style="width: 18px; height: 18px; margin: 0; accent-color: {{mark}}"></label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">Snap to screen corners<input type="checkbox" checked="{{ true }}" style="width: 18px; height: 18px; margin: 0; accent-color: {{mark}}"></label>
          <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">Launch at login<input type="checkbox" checked="{{ false }}" style="width: 18px; height: 18px; margin: 0; accent-color: {{mark}}"></label>
        </div>
      </section>

    </div>

    <div style="padding: 14px 24px; border-top: 3px solid {{soft}}; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <button type="button" style="height: 44px; box-sizing: border-box; padding: 0 16px; background: transparent; border: 3px solid {{sub}}; border-radius: 14px; color: {{text}}; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; cursor: pointer">Reset to defaults</button>
      <button type="button" style="height: 44px; box-sizing: border-box; padding: 0 28px; background: {{btn}}; border: 3px solid {{btnEdge}}; border-radius: 14px; color: {{btnInk}}; font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 16px; cursor: pointer">Done</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Lilac","Mint","Peach","Starlight"],"default":"Lilac"},"$preview":{"width":600,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
var themes = {
Lilac: { shell: '#CDB8F6', edge: '#9A80D8', bezel: '#FFF6FC', btn: '#F9A1CF', btnEdge: '#D45F9C', btnInk: '#5A2348', sky: '#FBEFFF', text: '#4B3A78', sub: '#6E5E99', soft: '#EBDDFB', mark: '#C2559A' },
Mint: { shell: '#B8EBD4', edge: '#6FBF9F', bezel: '#FBFFF8', btn: '#FFE08A', btnEdge: '#D9A93A', btnInk: '#5A4410', sky: '#EFFBF1', text: '#2F5A4A', sub: '#4B7868', soft: '#D9F3E1', mark: '#23896A' },
Peach: { shell: '#FFD0B8', edge: '#E89A78', bezel: '#FFFBF4', btn: '#A9DDF2', btnEdge: '#5FA9C9', btnInk: '#1F4A5E', sky: '#FFF4E6', text: '#6B3F2A', sub: '#8A5A42', soft: '#FFE6CF', mark: '#C8552B' },
Starlight: { shell: '#B9CFF7', edge: '#7C98DA', bezel: '#F6F9FF', btn: '#FFC2DD', btnEdge: '#E07FAE', btnInk: '#6A2449', sky: '#2E2A66', text: '#2E2A66', sub: '#55528F', soft: '#DDE8FB', mark: '#5B6FD6' }
};
var name = themes[this.props.theme] ? this.props.theme : 'Lilac';
var th = themes[name];
var sel = {};
['Lilac', 'Mint', 'Peach', 'Starlight'].forEach(function (n) {
var on = n === name;
sel[n] = { on: on, bg: on ? th.soft : 'transparent', bd: on ? th.mark : th.soft };
});
return Object.assign({ sel: sel }, th);
}
}
</script>
</body>
</html>
